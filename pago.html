html{scroll-behavior:smooth}

.grid{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(28px,4vw,56px);margin-top:clamp(36px,5vw,60px);align-items:start}

.paynote{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:13px 15px;border-radius:14px;background:rgba(76,201,232,.07);border:1px solid rgba(76,201,232,.2);color:var(--muted);font-size:.76rem;font-weight:300}

.picker{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:40px}

.resbox input,.resbox textarea{width:100%;background:rgba(4,15,20,.55);border:1px solid var(--line);border-radius:12px;padding:13px 16px;color:var(--cream);font-family:var(--sans);font-size:.9rem;outline:none;transition:border-color .3s,box-shadow .3s}

.res-ok{text-align:center;padding:24px 10px}
.res-ok .big{font-family:var(--serif);font-size:1.5rem;margin-bottom:10px;color:var(--mint)}
.res-ok p{color:var(--muted);font-size:.86rem;font-weight:300}

footer a{color:var(--muted);text-decoration:none;transition:color .3s}
footer a:hover{color:var(--mint)}
.rv{opacity:0;transform:translateY(30px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.rv.on{opacity:1;transform:none}
</style>
</head>

          '<div class="mainimg rv"><div class="ph">'+phSVG()+'<p>'+t.img+'</p></div></div>'+
          '<div class="box rv"><h3>Qué incluye</h3><ul class="inc">'+t.inc.map(function(i){return "<li>"+i+"</li>"}).join("")+'</ul></div>'+
          '<div class="helpbar rv">¿Dudas antes de reservar? <span>Escribinos a <a href="mailto:hola@bienaventurados.com">hola@bienaventurados.com</a> o por <a href="https://www.instagram.com/bien_aventurados_pdu/" target="_blank" rel="noopener">Instagram</a></span></div>'+
        '</div>'+
        '<div class="paycol">'+
          '<div class="pricecard rv">'+
            '<small>Precio por persona</small>'+
            '<div class="amount"><i>USD</i> '+t.price.toLocaleString("es-UY")+'</div>'+
            '<p class="per">Base habitación doble · Precio final según fecha y cantidad de viajeros</p>'+
            '<div class="persrow"><span>¿Para cuántas personas pagás?</span>'+
              '<div class="stepper"><button type="button" id="p-minus" aria-label="Menos">−</button><b id="np">2</b><button type="button" id="p-plus" aria-label="Más">+</button></div>'+
            '</div>'+
            '<div style="margin-top:14px">'+
              '<div class="priceline"><span>Total (<span id="np2">2</span> personas)</span><b data-calc="total"></b></div>'+
              '<div class="priceline"><span>Reservás hoy con la seña del 20%</span><b data-calc="senia"></b></div>'+
              '<div class="priceline"><span>Saldo hasta 30 días antes de viajar</span><b data-calc="saldo"></b></div>'+
            '</div>'+
            '<p class="pricenote">Cancelación flexible hasta 15 días antes · Todos los pagos con comprobante y confirmación por email. También puede pagar cada uno lo suyo: indicalo en la reserva.</p>'+
          '</div>'+
          '<div class="box resbox rv" id="res-wrap">'+
            '<h3>1 · Reservá tus lugares</h3>'+
            '<p style="color:var(--muted);font-size:.84rem;font-weight:300;margin-bottom:18px">Guardamos tu lugar y nos llega el aviso al instante. Después pagás la seña con el medio que prefieras.</p>'+
            '<form id="resform" novalidate>'+
              '<div class="field"><label for="rn">Nombre y apellido</label><input id="rn" type="text" placeholder="Tu nombre" required></div>'+
              '<div class="field"><label for="re">Email</label><input id="re" type="email" placeholder="tu@email.com" required></div>'+
              '<div class="field"><label for="rw">WhatsApp</label><input id="rw" type="tel" placeholder="09x xxx xxx"></div>'+
              '<div class="field"><label for="rc">Comentarios (opcional)</label><textarea id="rc" placeholder="Ej: pagamos por separado, viajamos con un bebé…"></textarea></div>'+
              '<button type="submit" class="btn btn-solid" id="res-btn">Reservar <span id="np3">2</span> lugares →</button>'+
            '</form>'+
          '</div>'+
          '<div class="box rv" style="margin-top:22px;padding:0;border:0;background:none">'+
            '<h3 style="padding:0 4px">2 · Pagá la seña</h3>'+
          '</div>'+
          payBox(t.name)+
        '</div>'+
      '</div>';
  }else{
    app.innerHTML=
      '<div class="kicker rv">Reservá tu viaje</div>'+
      '<h1 class="rv">¿A dónde <em>nos vamos?</em></h1>'+
      '<p class="rv" style="color:var(--muted);margin-top:16px;max-width:520px;font-weight:300">Elegí tu viaje para ver cuánto sale, qué incluye y cómo pagarlo.</p>'+
      '<div class="picker">'+Object.keys(TRIPS).map(function(k){
        var v=TRIPS[k];
        return '<a class="pick rv" href="pago.html?viaje='+k+'"><h3>'+v.name+'</h3><span>'+v.days+'</span><b>Desde '+money(v.price)+'</b></a>';
      }).join("")+'</div>';
  }

  /* Personas + recálculo */
  var RESERVA_EMAIL="ssoba93@gmail.com"; // ← cambiá acá el mail que recibe las reservas
  var pers=2;
  function recalc(){
    if(!t)return;
    var total=t.price*pers,senia=Math.round(total*.2);
    ["np","np2","np3"].forEach(function(id){var e=document.getElementById(id);if(e)e.textContent=pers});
    document.querySelectorAll('[data-calc="total"]').forEach(function(e){e.textContent=money(total)});
    document.querySelectorAll('[data-calc="senia"]').forEach(function(e){e.textContent=money(senia)});
    document.querySelectorAll('[data-calc="saldo"]').forEach(function(e){e.textContent=money(total-senia)});
    var rb=document.getElementById("res-btn");
    if(rb)rb.innerHTML="Reservar "+pers+(pers===1?" lugar":" lugares")+" →";
  }
  if(t){
    document.getElementById("p-minus").addEventListener("click",function(){if(pers>1){pers--;recalc()}});
    document.getElementById("p-plus").addEventListener("click",function(){if(pers<30){pers++;recalc()}});
    recalc();
  }

  /* Reserva → email */
  var rf=document.getElementById("resform");
  if(rf)rf.addEventListener("submit",function(e){
    e.preventDefault();
    var rn=document.getElementById("rn"),re_=document.getElementById("re");
    if(!rn.value.trim()){rn.focus();rn.style.borderColor="#e0655f";return}
    if(!re_.value.trim()||re_.value.indexOf("@")<0){re_.focus();re_.style.borderColor="#e0655f";return}
    var total=t.price*pers,senia=Math.round(total*.2);
    var btn=document.getElementById("res-btn");
    btn.disabled=true;btn.textContent="Enviando reserva…";
    fetch("https://formsubmit.co/ajax/"+RESERVA_EMAIL,{
      method:"POST",
      headers:{"Content-Type":"application/json","Accept":"application/json"},
      body:JSON.stringify({
        _subject:"🧳 NUEVA RESERVA — "+t.name+" · "+pers+" personas",
        _template:"table",
        "Viaje":t.name,
        "Personas":pers,
        "Precio por persona":money(t.price),
        "Total":money(total),
        "Seña a cobrar (20%)":money(senia),
        "Nombre":rn.value.trim(),
        "Email":re_.value.trim(),
        "WhatsApp":document.getElementById("rw").value.trim()||"—",
        "Comentarios":document.getElementById("rc").value.trim()||"—",
        "Fecha de la reserva":new Date().toLocaleString("es-UY")
      })
    })
    .then(function(r){if(!r.ok)throw new Error();return r.json()})
    .then(function(){
      document.getElementById("res-wrap").innerHTML=
        '<div class="res-ok"><div class="big">¡Lugares reservados! 🎉</div>'+
        '<p>Recibimos tu reserva de <b>'+pers+'</b> lugar'+(pers===1?"":"es")+' para <b>'+t.name+'</b>.<br><br>'+
        'Ahora pagá la seña de <b>'+money(senia)+'</b> con el medio que prefieras (abajo) y envianos el comprobante. Te confirmamos por email en el día.</p></div>';
    })
    .catch(function(){
      btn.disabled=false;recalc();
      alert("No pudimos enviar la reserva automáticamente. Escribinos a hola@bienaventurados.com o por Instagram y te la tomamos al toque.");
    });
  });

  /* Tabs */
  var payTabs=document.querySelectorAll(".paytabs button");
  payTabs.forEach(function(tb){
    tb.addEventListener("click",function(){
      payTabs.forEach(function(x){x.classList.remove("on")});
      document.querySelectorAll(".paypanel").forEach(function(p){p.classList.remove("on")});
      tb.classList.add("on");
      document.getElementById("pay-"+tb.dataset.pay).classList.add("on");
    });
  });
  /* Copiar */
  document.querySelectorAll(".copybtn").forEach(function(b){
    b.addEventListener("click",function(){
      var txt=b.dataset.copy;
      function done(){b.textContent="¡Copiado!";b.classList.add("ok");setTimeout(function(){b.textContent="Copiar";b.classList.remove("ok")},1800)}
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done)}
      else{var ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta);done()}
    });
  });
  var cardBtn=document.getElementById("cardpay-btn");
  if(cardBtn)cardBtn.addEventListener("click",function(e){
    e.preventDefault();
    alert("La pasarela de tarjeta todavía no está conectada.\nCuando tengas tu cuenta de Mercado Pago o Stripe, este botón llevará directo al checkout seguro.");
  });
  /* Reveal */
  var io=new IntersectionObserver(function(entries){
    entries.forEach(function(en){if(en.isIntersecting){en.target.classList.add("on");io.unobserve(en.target)}});
  },{threshold:.1});
  document.querySelectorAll(".rv").forEach(function(el,i){el.style.transitionDelay=(i%4)*70+"ms";io.observe(el)});
})();
</script>
</body>
</html>
